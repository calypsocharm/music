<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1025">
<meta name="description" content="Positivity & abundance music from Calypso — listen free.">
<link rel="manifest" href="/manifest-channel.webmanifest">
<link rel="icon" type="image/png" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<title>Calypso Radio — free channel</title>
<style>
  :root {
    --bg: #1a1025; --bg2: #241536; --card: #2d1b44; --card-hi: #3a2458;
    --text: #f3ecff; --dim: #a894c9; --accent: #f0a35e; --accent2: #e05c9c;
    --player-h: 150px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
    min-height: 100vh; color: var(--text);
  }
  .hero { text-align: center; padding: max(env(safe-area-inset-top), 26px) 20px 8px; }
  .hero .star { font-size: 3rem; color: var(--accent); }
  h1 { margin: 6px 0 4px; font-size: 1.8rem; }
  .tagline { color: var(--dim); margin: 0 0 16px; }
  #installBtn {
    display: none; margin: 0 auto 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #2a1020; font-weight: 800; border: 0; border-radius: 999px;
    padding: 12px 26px; font-size: 1rem; cursor: pointer;
    box-shadow: 0 4px 16px rgba(224, 92, 156, .4);
  }
  .install-hint { color: var(--dim); font-size: .8rem; margin: 4px 20px 14px; text-align: center; }
  #list { padding: 4px 12px calc(var(--player-h) + 30px); max-width: 560px; margin: 0 auto; }
  .track {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
    cursor: pointer; user-select: none;
  }
  .track.playing { background: var(--card-hi); outline: 2px solid var(--accent2); }
  .track .art {
    width: 42px; height: 42px; flex: none; border-radius: 10px;
    background-size: cover; background-position: center;
    display: grid; place-items: center; font-size: 1.1rem;
  }
  .track .info { flex: 1; min-width: 0; }
  .track .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track .dl { flex: 0 0 auto; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--dim); text-decoration: none; font-size: 1.05rem; }
  .track .dl:hover { background: var(--card-hi); color: #fff; }
  .section { color: var(--dim); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin: 18px 8px 6px; }
  .track .meta { color: var(--dim); font-size: .78rem; margin-top: 2px; }
  #empty { text-align: center; color: var(--dim); padding: 50px 30px; line-height: 1.7; }
  #player {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(26, 16, 37, .96); backdrop-filter: blur(14px);
    border-top: 1px solid rgba(240, 163, 94, .25);
    padding: 10px 16px calc(max(env(safe-area-inset-bottom), 10px));
  }
  #nowRow { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 6px 6px; }
  #liveBadge {
    display: none; flex: none; font-size: .68rem; font-weight: 800; letter-spacing: .08em;
    padding: 3px 8px; border-radius: 999px; background: #c8264f; color: #fff;
  }
  #liveBadge.on { display: inline-block; }
  #liveBadge.on::before { content: "● "; animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  #nowTitle { font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #seekRow { display: flex; align-items: center; gap: 8px; font-size: .72rem; color: var(--dim); }
  #seek { flex: 1; accent-color: var(--accent2); height: 22px; }
  #controls { display: flex; align-items: center; justify-content: center; gap: 14px; }
  #controls button {
    background: none; border: 0; color: var(--text); cursor: pointer;
    font-size: 1.5rem; padding: 6px 10px; border-radius: 50%;
  }
  #playBtn {
    background: linear-gradient(135deg, var(--accent), var(--accent2)) !important;
    color: #2a1020 !important; width: 58px; height: 58px; font-size: 1.6rem !important;
  }
  #liveBtn { font-size: .8rem !important; font-weight: 700; color: var(--accent) !important; border-radius: 999px !important; padding: 6px 12px !important; display: none; }
  #liveBtn.show { display: inline-block; }
  #status { text-align: center; color: var(--dim); font-size: .74rem; min-height: 1.1em; padding-top: 2px; }
  #volRow { display: flex; align-items: center; gap: 8px; font-size: .85rem; padding: 0 24px; }
  #vol { flex: 1; accent-color: var(--accent); height: 20px; }
  footer { text-align: center; color: var(--dim); font-size: .78rem; padding: 10px 20px 20px; }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<div class="hero">
  <div class="star">✦</div>
  <h1>Calypso Radio</h1>
  <p class="tagline">Positivity &amp; abundance — listen free 🌻</p>
  <button id="installBtn">📲 Get the app</button>
  <div class="install-hint" id="installHint"></div>
</div>

<div id="list"></div>

<div id="player">
  <div id="nowRow"><span id="liveBadge">LIVE</span><span id="nowTitle">Tap play to tune in ✨</span></div>
  <div id="seekRow">
    <span id="tCur">0:00</span>
    <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
    <span id="tDur">0:00</span>
  </div>
  <div id="controls">
    <button id="liveBtn" title="Back to the live station">◉ Live</button>
    <button id="playBtn">▶</button>
  </div>
  <div id="status"></div>
  <div id="volRow"><span>🔈</span><input type="range" id="vol" min="0" max="100" value="100"><span>🔊</span></div>
</div>

<audio id="audio" preload="none"></audio>
<footer><a href="/">owner sign-in</a></footer>

<script>
// How this player works (2026-09-14):
// The station is ONE endless MP3 stream from the server (/radio.mp3). The browser opens it
// once and keeps receiving music, so there is never a song boundary for the phone to trip
// on. Earlier versions loaded songs one at a time and Android kept killing playback at the
// hand-off once the screen was off - two rounds of patching that did not cure it.
// Tapping a song still plays just that song (foreground use); when it ends, back to live.
const $ = (id) => document.getElementById(id);
const audio = $('audio');
const STREAM = '/radio.mp3';
let tracks = [], videos = [];
let wantPlaying = false;     // she pressed play and has not pressed pause
let mode = 'live';           // 'live' (the stream) or 'single' (one tapped song)
let singlePos = -1;
let now = null;              // last /api/now-playing answer
let nowAt = 0;               // when it was fetched
let retries = 0;
const fmtTime = (s) => {
  if (!isFinite(s) || s < 0) return '0:00';
  return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
};
const coverCache = new Map();
function coverFor(name, size) {
  const key = name + '@' + size;
  if (coverCache.has(key)) return coverCache.get(key);
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const hue1 = h % 360, hue2 = (hue1 + 50 + (h >> 4) % 90) % 360;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, 'hsl(' + hue1 + ' 48% 40%)');
  g.addColorStop(1, 'hsl(' + hue2 + ' 55% 22%)');
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  const rg = x.createRadialGradient(size * .68, size * .3, size * .04, size * .68, size * .3, size * .65);
  rg.addColorStop(0, 'rgba(255,222,160,.45)'); rg.addColorStop(1, 'rgba(255,222,160,0)');
  x.fillStyle = rg; x.fillRect(0, 0, size, size);
  x.fillStyle = 'rgba(255,255,255,.92)';
  x.font = 'bold ' + size * .46 + 'px serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('✦', size / 2, size * .55);
  const url = c.toDataURL('image/png');
  coverCache.set(key, url);
  return url;
}
function fmtSize(b) { return (b / 1048576).toFixed(1) + ' MB'; }
function row(t, i) {
  const el = document.createElement('div');
  el.className = 'track';
  el.dataset.name = t.name;
  el.innerHTML = '<div class="art">' + (t.kind === 'video' ? '🎬' : '') + '</div>' +
    '<div class="info"><div class="title"></div><div class="meta"></div></div>' +
    '<a class="dl" title="Download" aria-label="Download">⬇</a>';
  el.querySelector('.title').textContent = t.title;
  el.querySelector('.meta').textContent = (t.kind === 'video' ? 'video' : 'song') + ' · ' + fmtSize(t.size);
  el.querySelector('.art').style.backgroundImage = 'url(' + coverFor(t.name, 84) + ')';
  const dl = el.querySelector('.dl');
  dl.href = t.url;
  dl.setAttribute('download', t.name);
  dl.addEventListener('click', (e) => e.stopPropagation());
  if (t.kind === 'video') {
    // videos open on their own; they are never part of the station
    el.addEventListener('click', () => window.open(t.url, '_blank', 'noopener'));
  } else {
    el.addEventListener('click', () => playSingle(i));
  }
  return el;
}
async function load() {
  const all = await (await fetch('/api/channel')).json();
  tracks = all.filter((t) => t.kind === 'audio');
  videos = all.filter((t) => t.kind === 'video');
  const list = $('list');
  list.innerHTML = '';
  if (!all.length) {
    list.innerHTML = '<div id="empty">🎧<br>Nothing shared yet — check back soon!</div>';
    return;
  }
  tracks.forEach((t, i) => list.appendChild(row(t, i)));
  if (videos.length) {
    const h = document.createElement('div');
    h.className = 'section';
    h.textContent = 'Videos';
    list.appendChild(h);
    videos.forEach((t) => list.appendChild(row(t, -1)));
  }
}
function markPlaying(name) {
  document.querySelectorAll('.track').forEach((el) => el.classList.toggle('playing', !!name && el.dataset.name === name));
}
function setSession(title) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: title || 'Calypso Radio', artist: 'Calypso Radio',
    artwork: [{ src: coverFor(title || 'radio', 512), sizes: '512x512', type: 'image/png' }],
  });
  navigator.mediaSession.setActionHandler('play', () => userPlay());
  navigator.mediaSession.setActionHandler('pause', () => userPause());
  try { navigator.mediaSession.setActionHandler('nexttrack', null); } catch (e) {}
  try { navigator.mediaSession.setActionHandler('previoustrack', null); } catch (e) {}
}
function status(msg) { $('status').textContent = msg || ''; }

// --- the live station ---
function tuneIn() {
  mode = 'live'; singlePos = -1;
  $('liveBadge').classList.add('on');
  $('liveBtn').classList.remove('show');
  $('seek').disabled = true;
  markPlaying(now && now.name);
  $('nowTitle').textContent = now && now.title ? '♪ ' + now.title : 'Tuning in…';
  // a fresh connection every time: a paused live stream is stale, so never resume it
  audio.src = STREAM + '?t=' + Date.now();
  audio.load();
  const p = audio.play();
  if (p && p.catch) p.catch(() => { status('Tap play to start'); });
  setSession(now && now.title);
  refreshNow(true);
}
async function refreshNow(force) {
  if (mode !== 'live') return;
  if (!force && document.visibilityState !== 'visible') return;
  try {
    const r = await fetch('/api/now-playing', { cache: 'no-store' });
    if (!r.ok) return;
    now = await r.json(); nowAt = Date.now();
    if (now.title) {
      $('nowTitle').textContent = '♪ ' + now.title;
      markPlaying(now.name);
      setSession(now.title);
    }
  } catch (e) {}
}
setInterval(() => refreshNow(false), 10000);
// progress bar for the live song, from the server clock (nudged locally between polls)
setInterval(() => {
  if (mode !== 'live' || !now || !now.duration) return;
  const elapsed = Math.min(now.duration, now.elapsed + (Date.now() - nowAt) / 1000);
  $('tCur').textContent = fmtTime(elapsed);
  $('tDur').textContent = fmtTime(now.duration);
  $('seek').value = elapsed / now.duration * 100;
  if (elapsed >= now.duration - 0.5) refreshNow(true);
}, 1000);

// --- one tapped song (foreground use) ---
function playSingle(i) {
  if (!tracks.length) return;
  mode = 'single';
  singlePos = ((i % tracks.length) + tracks.length) % tracks.length;
  const t = tracks[singlePos];
  wantPlaying = true;
  $('liveBadge').classList.remove('on');
  $('liveBtn').classList.add('show');
  $('seek').disabled = false;
  $('nowTitle').textContent = '♪ ' + t.title;
  markPlaying(t.name);
  audio.src = t.url;
  audio.load();
  const p = audio.play();
  if (p && p.catch) p.catch(() => {});
  setSession(t.title);
  status('Playing this song only · tap Live to return to the station');
}

function userPlay() {
  wantPlaying = true; retries = 0; status('');
  if (mode === 'single' && audio.src && audio.paused && !audio.ended) { audio.play().catch(() => {}); return; }
  tuneIn();
}
function userPause() {
  wantPlaying = false;
  audio.pause();
  // Dropping the connection (load()) also cancels the browser's queued 'pause' event,
  // so the button and lock-screen state are set here rather than in the event handler.
  $('playBtn').textContent = '▶';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  if (mode === 'live') { audio.removeAttribute('src'); audio.load(); } // a paused live stream is stale
}
$('playBtn').addEventListener('click', () => { if (audio.paused) userPlay(); else userPause(); });
$('liveBtn').addEventListener('click', () => { wantPlaying = true; tuneIn(); });

// --- keep it going ---
// The stream dropped (bad signal, tab restored after a freeze, a rejected play()): reconnect,
// backing off a little each time, as long as she still wants music.
let reconnectTimer = null;
function reconnect(why) {
  if (!wantPlaying || mode !== 'live') return;
  clearTimeout(reconnectTimer);
  const wait = Math.min(15000, 800 * Math.pow(2, retries++));
  status('Reconnecting…');
  reconnectTimer = setTimeout(() => { if (wantPlaying && mode === 'live') tuneIn(); }, wait);
}
audio.addEventListener('ended', () => {
  if (mode === 'single') { wantPlaying = true; tuneIn(); }   // back to the station
  else reconnect('ended');                                    // a live stream should never end
});
audio.addEventListener('error', () => { if (mode === 'live') reconnect('error'); });
audio.addEventListener('stalled', () => { if (mode === 'live') stallWatch(); });
audio.addEventListener('waiting', () => { if (mode === 'live') stallWatch(); });
let stallTimer = null, lastTime = -1;
function stallWatch() {
  clearTimeout(stallTimer);
  stallTimer = setTimeout(() => {
    if (wantPlaying && mode === 'live' && audio.currentTime === lastTime) reconnect('stall');
  }, 15000);
  lastTime = audio.currentTime;
}
audio.addEventListener('playing', () => { retries = 0; status(''); clearTimeout(stallTimer); clearTimeout(reconnectTimer); });
audio.addEventListener('play', () => {
  $('playBtn').textContent = '⏸';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
});
audio.addEventListener('pause', () => {
  $('playBtn').textContent = '▶';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  // paused by the system (a call, another app grabbing audio): come back once it is over
  if (wantPlaying && mode === 'live') setTimeout(() => { if (wantPlaying && audio.paused) reconnect('system pause'); }, 3000);
});
audio.addEventListener('timeupdate', () => {
  if (mode !== 'single') return;
  $('tCur').textContent = fmtTime(audio.currentTime);
  $('tDur').textContent = fmtTime(audio.duration);
  if (!seeking && isFinite(audio.duration)) $('seek').value = audio.currentTime / audio.duration * 100;
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  refreshNow(true);
  if (wantPlaying && audio.paused) { retries = 0; if (mode === 'live') tuneIn(); else audio.play().catch(() => {}); }
});
document.addEventListener('click', () => {
  if (wantPlaying && audio.paused && !reconnectTimer) { if (mode === 'live') tuneIn(); else audio.play().catch(() => {}); }
}, true);
let seeking = false;
$('seek').addEventListener('input', () => { seeking = true; });
$('seek').addEventListener('change', () => {
  if (mode === 'single' && isFinite(audio.duration)) audio.currentTime = $('seek').value / 100 * audio.duration;
  seeking = false;
});
$('vol').addEventListener('input', () => { audio.volume = $('vol').value / 100; });
// install button: real prompt when the browser offers one, gentle hint otherwise
let installEvent = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  installEvent = e;
  $('installBtn').style.display = 'inline-block';
});
$('installBtn').addEventListener('click', async () => {
  if (installEvent) { installEvent.prompt(); installEvent = null; $('installBtn').style.display = 'none'; }
});
if (/iPhone|iPad/.test(navigator.userAgent)) {
  $('installHint').textContent = 'On iPhone: tap Share, then "Add to Home Screen" to install';
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
$('seek').disabled = true;
$('liveBadge').classList.add('on');
load().then(() => refreshNow(true));
</script>
</body>
</html>
